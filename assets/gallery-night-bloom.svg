<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Flor de nocturno</title>
  <desc id="desc">Ilustracion minimalista de una flor nocturna simbolica.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15100f"/>
      <stop offset="60%" stop-color="#080706"/>
      <stop offset="100%" stop-color="#17110f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#8f6d49" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#8f6d49" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
